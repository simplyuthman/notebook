services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: notes_book
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://devuser:devpassword@db:5432/notes_book?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: npm run start:worker
    environment:
      - DATABASE_URL=postgresql://devuser:devpassword@db:5432/notes_book?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
volumes:
  pgdata:
